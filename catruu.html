<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@</title>
    <!-- Tu icono personalizado en la pestaña -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/1cv7on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuente Syne (estilo Bellini) + Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            color: #ffffff;
        }

        /* Pantalla de entrada */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.7s ease;
        }

        #enter-screen span {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            animation: pulse 2.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Video de fondo */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.85);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
        }

        /* Tarjeta Principal */
        .profile-card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.34);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 18px;
            padding: 32px 24px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .main-avatar {
            width: 94px;
            height: 94px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 12px;
            box-shadow: 0 0 22px rgba(0, 0, 0, 0.6);
        }

        /* Nombre central estilo Bellini ("Catruu" con mayúscula inicial y minúsculas) */
        .title-glow {
            font-family: 'Syne', sans-serif;
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.75), 0 0 35px rgba(168, 85, 247, 0.45);
            margin-bottom: 4px;
            line-height: 1.1;
        }

        /* Subtítulo en MAYÚSCULAS ("KYVEN STORE") */
        .subtitle {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2.2px;
            color: rgba(255, 255, 255, 0.82);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Mini tarjeta de estado de Discord real */
        .discord-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 20, 24, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 22px;
            min-width: 255px;
        }

        .discord-avatar-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .discord-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2.5px solid #141416;
            background-color: #f23f43;
            transition: background-color 0.3s ease;
        }

        .discord-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.92rem;
            color: #fff;
        }

        .clan-tag {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 5px;
            color: #e4e4e7;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .clan-tag i {
            color: #a855f7;
            font-size: 0.62rem;
        }

        .discord-activity {
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.68);
            margin-top: 2px;
            max-width: 190px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Redes Sociales */
        .social-links {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.55rem;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
        }

        .social-links a:hover {
            transform: scale(1.16) translateY(-2px);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Contador de vistas reales */
        .views-counter {
            position: absolute;
            bottom: 14px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Barra Reproductor Inferior */
        .music-player {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.34);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .album-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 4px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .player-controls i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .player-controls i:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="enter-screen">
        <span>click to enter...</span>
    </div>

    <!-- Video de fondo -->
    <video id="bg-video" loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/njkp5q.mp4" type="video/mp4">
    </video>

    <!-- Tu canción MP3 -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://files.catbox.moe/yu0f1s.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <div class="profile-card">
            <img id="top-avatar" class="main-avatar" src="https://files.catbox.moe/1cv7on.png" alt="Avatar">
            
            <!-- Nombre con fuente estilo Bellini (Solo primera letra mayúscula) -->
            <h1 class="title-glow">Catruu</h1>
            <!-- Solo KYVEN STORE en mayúsculas -->
            <p class="subtitle">KYVEN STORE</p>

            <!-- Caja de Discord conectada en vivo -->
            <div class="discord-box">
                <div class="discord-avatar-wrap">
                    <img id="dc-avatar" src="https://files.catbox.moe/1cv7on.png" alt="Discord">
                    <div id="dc-status" class="status-dot"></div>
                </div>
                <div class="discord-info">
                    <div class="discord-name-row">
                        <span id="dc-username">catruuu</span>
                        <span class="clan-tag">🗡️ LC</span>
                    </div>
                    <span id="dc-activity" class="discord-activity">currently doing nothing</span>
                </div>
            </div>

            <!-- Tus links reales -->
            <div class="social-links">
                <a href="https://discord.gg/RH6KsX77p4" target="_blank" rel="noopener noreferrer" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="https://www.tiktok.com/@catrii.valdez" target="_blank" rel="noopener noreferrer" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://steamcommunity.com/id/DexterM0ser/" target="_blank" rel="noopener noreferrer" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
            </div>

            <!-- Contador de vistas reales por IP -->
            <div class="views-counter">
                <i class="fa-regular fa-eye"></i>
                <span id="view-count">1</span>
            </div>
        </div>

        <!-- Barra reproductora con tu foto -->
        <div class="music-player">
            <div class="album-cover">
                <img src="https://files.catbox.moe/2j0e1z.jpg" alt="Cover">
            </div>
            <div class="track-details">
                <div class="track-title">AMANECE</div>
                <div class="progress-row">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                <i class="fa-solid fa-pause" id="play-pause-btn"></i>
                <i class="fa-solid fa-forward-step" id="next-btn"></i>
            </div>
        </div>
    </div>

    <script>
        // --- Animación suave (smooth) del título en la pestaña (@C -> @Ca -> @Catruu) ---
        const tabWord = "Catruu";
        let charIndex = 0;
        let isDeleting = false;

        function animateTabTitle() {
            document.title = "@" + tabWord.substring(0, charIndex);

            // Tiempos más lentos y relajados para que se sienta smooth
            let speed = isDeleting ? 380 : 520;

            if (!isDeleting && charIndex === tabWord.length) {
                speed = 2000; // Se queda 2 segundos mostrando @Catruu completo
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                speed = 700; // Pausa suave en @ antes de volver a escribir
                isDeleting = false;
            }

            charIndex += isDeleting ? -1 : 1;
            setTimeout(animateTabTitle, speed);
        }
        animateTabTitle();

        // --- Controles de Video y Música ---
        const enterScreen = document.getElementById('enter-screen');
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        audio.volume = 0.45;

        enterScreen.addEventListener('click', () => {
            enterScreen.style.opacity = '0';
            setTimeout(() => enterScreen.style.display = 'none', 700);
            video.play();
            audio.play();
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playPauseBtn.className = 'fa-solid fa-play';
            }
        });

        prevBtn.addEventListener('click', () => { audio.currentTime = 0; });
        nextBtn.addEventListener('click', () => { audio.currentTime = 0; });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audio.duration) {
                audio.currentTime = (clickX / rect.width) * audio.duration;
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent || 0}%`;
        });

        // --- Cargar tu estado real de Discord y vistas reales ---
        async function fetchDiscordStatus() {
            try {
                const res = await fetch('/api/catruu-status');
                const data = await res.json();

                document.getElementById('dc-username').textContent = data.username || 'catruuu';
                if (data.avatar) {
                    document.getElementById('dc-avatar').src = data.avatar;
                    document.getElementById('top-avatar').src = data.avatar;
                }
                document.getElementById('dc-activity').textContent = data.activity || 'currently doing nothing';
                document.getElementById('view-count').textContent = data.views;

                const statusColors = {
                    online: '#23a55a', // Verde (Conectado)
                    idle: '#f0b232',   // Amarillo (Ausente)
                    dnd: '#f23f43',    // Rojo (No molestar)
                    offline: '#80848e' // Gris (Desconectado)
                };
                document.getElementById('dc-status').style.backgroundColor = statusColors[data.status] || '#80848e';
            } catch (e) {
                console.error('Error cargando estado de Discord:', e);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 30000); // Refresca cada 30s
    </script>
</body>
</html>
