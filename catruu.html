<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@</title>
    <!-- Icono en la pestaña -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/1cv7on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuentes: Syne (Catruu), Rubik Bubbles / Fredoka (estilo Discord Toon para Im,Catri) e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;600;700&family=Rubik+Bubbles&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* Cursor personalizado (.cur) aplicado a toda la página y elementos interactivos */
        *, html, body, a, i, button, input, #enter-screen, .location-row, .discord-box, .views-counter, .progress-bar-bg, .top-volume-widget {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            cursor: url('https://files.catbox.moe/eiz2nf.cur'), auto !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            color: #ffffff;
        }

        /* Pantalla de entrada */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), backdrop-filter 0.65s ease;
        }

        #enter-screen span {
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: #fff;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.85);
            animation: pulse 2.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* =========================================================
           BOTÓN DE VOLUMEN SUPERIOR DERECHO (ESTILO GUNS.LOL)
           ========================================================= */
        .top-volume-widget {
            position: fixed;
            top: 22px;
            right: 24px;
            z-index: 500;
            display: flex;
            align-items: center;
            background: rgba(15, 15, 18, 0.38);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50px;
            padding: 10px 13px;
            gap: 0px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition:
                opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s,
                transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s,
                background 0.25s ease,
                border-color 0.25s ease,
                padding 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                gap 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.entered .top-volume-widget {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .top-volume-widget:hover {
            background: rgba(24, 24, 30, 0.62);
            border-color: rgba(255, 255, 255, 0.32);
            padding: 10px 16px;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 16px rgba(255, 255, 255, 0.12);
        }

        .vol-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.05rem;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .vol-btn:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1));
        }

        .vol-slider-wrap {
            width: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
        }

        .top-volume-widget:hover .vol-slider-wrap {
            width: 88px;
            opacity: 1;
        }

        #vol-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 88px;
            height: 5px;
            border-radius: 6px;
            background: linear-gradient(to right, #ffffff 45%, rgba(255, 255, 255, 0.22) 45%);
            outline: none;
        }

        #vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
            transition: transform 0.15s ease;
        }

        #vol-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        #vol-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
            transition: transform 0.15s ease;
        }

        /* Video de fondo con zoom suave al abrir */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%) scale(1.06);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.72) blur(4px);
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 1.1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.entered #bg-video {
            transform: translate(-50%, -50%) scale(1);
            filter: brightness(0.88) blur(0px);
        }

        /* Contenedor con perspectiva 3D */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            perspective: 1100px;
        }

        /* =========================================================
           ANIMACIÓN SMOOTH DE APERTURA (ESTILO VIDEO 2)
           ========================================================= */
        .tilt-card {
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            will-change: transform, opacity;
        }

        /* Estado inicial antes de abrir: tarjeta comprimida al centro con borde tenue */
        .profile-card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.05);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            padding: 32px 24px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            opacity: 0;
            transform: scaleX(0.72) scaleY(0.18) translateY(18px);
            transition:
                opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.75s ease,
                backdrop-filter 0.75s ease,
                border-color 0.4s ease,
                box-shadow 0.75s ease;
        }

        body.entered .profile-card {
            opacity: 1;
            background: rgba(15, 15, 18, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            transform: scaleX(1) scaleY(1) translateY(0);
        }

        /* Una vez abierta la página, el 3D responde rápido al mouse */
        body.ready-3d .tilt-card {
            transition: transform 0.15s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease;
        }

        /* Elementos internos escalonados (staggered reveal) */
        .reveal-item {
            opacity: 0;
            filter: blur(8px);
            transform: translateY(14px) scale(0.94);
            transition:
                opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s),
                filter 0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s),
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s);
        }

        body.entered .reveal-item {
            opacity: 1;
            filter: blur(0px);
            transform: translateY(0) scale(1) translateZ(var(--z-depth, 25px));
        }

        .tilt-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.11),
                transparent 45%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 0;
        }

        .tilt-card:hover::before {
            opacity: 1;
        }

        .tilt-card:hover {
            border-color: rgba(255, 255, 255, 0.24);
        }

        /* Imagen del medio fija con efecto al pasar el mouse */
        .main-avatar {
            --delay: 0.20s;
            --z-depth: 30px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.65);
            z-index: 2;
        }

        body.ready-3d .main-avatar {
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        body.ready-3d .main-avatar:hover {
            transform: translateZ(38px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
        }

        /* Contenedor de nombre con chispas blancas */
        .name-sparkle-wrap {
            --delay: 0.28s;
            --z-depth: 40px;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 18px;
            margin-bottom: 2px;
            z-index: 2;
        }

        .title-glow {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.9),
                0 0 28px rgba(255, 255, 255, 0.55),
                0 0 45px rgba(168, 85, 247, 0.45);
            line-height: 1.1;
            position: relative;
            z-index: 2;
            transition: transform 0.22s ease, text-shadow 0.22s ease;
        }

        .name-sparkle-wrap:hover .title-glow {
            transform: scale(1.06);
            text-shadow: 
                0 0 16px rgba(255, 255, 255, 1),
                0 0 34px rgba(255, 255, 255, 0.85),
                0 0 55px rgba(168, 85, 247, 0.75);
        }

        .sparkle-particle {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            box-shadow: 0 0 6px #ffffff, 0 0 10px rgba(255, 255, 255, 0.9);
            animation: floatSparkle linear infinite;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(4px) scale(0); opacity: 0; }
            35% { opacity: 1; transform: translateY(-2px) scale(1); }
            70% { opacity: 0.85; }
            100% { transform: translateY(-16px) scale(0); opacity: 0; }
        }

        /* Subtítulo en MAYÚSCULAS ("KYVEN STORE") */
        .subtitle {
            --delay: 0.35s;
            --z-depth: 25px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2.2px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            margin-bottom: 18px;
            z-index: 2;
        }

        body.ready-3d .subtitle {
            transition: transform 0.22s ease, text-shadow 0.22s ease, color 0.22s ease;
        }

        body.ready-3d .subtitle:hover {
            transform: translateZ(30px) scale(1.06);
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        /* Mini tarjeta redondeada de Discord */
        .discord-box {
            --delay: 0.43s;
            --z-depth: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(18, 18, 22, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.11);
            padding: 13px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            min-width: 285px;
            z-index: 2;
        }

        body.ready-3d .discord-box {
            transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        body.ready-3d .discord-box:hover {
            transform: translateZ(34px) scale(1.03) translateY(-2px);
            background: rgba(28, 28, 34, 0.56);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Contenedor del Avatar con el marco PNG de Venom (38e150.png) */
        .discord-avatar-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discord-avatar-wrap img.dc-user-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .venom-frame-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 68px;
            height: 68px;
            transform: translate(-50%, -50%);
            object-fit: contain;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.85));
            transition: transform 0.25s ease;
        }

        .discord-box:hover .venom-frame-overlay {
            transform: translate(-50%, -50%) scale(1.06);
        }

        .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2.5px solid #101014;
            background-color: #f23f43;
            transition: background-color 0.3s ease;
            z-index: 4;
        }

        .discord-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-name-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* Estilo de fuente "Dibujo animado" en blanco de Discord para Im,Catri */
        .discord-toon-nick {
            font-family: 'Rubik Bubbles', 'Fredoka', cursive, sans-serif;
            font-size: 1.02rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.4px;
            text-shadow:
                0 1px 0 #d4d4d8,
                0 2px 0 #18181b,
                -1px -1px 0 #18181b,
                1px -1px 0 #18181b,
                -1px 1px 0 #18181b,
                1px 1px 0 #18181b,
                0 0 10px rgba(255, 255, 255, 0.45);
            animation: toonBounce 3s ease-in-out infinite;
        }

        @keyframes toonBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }

        .discord-sub-username {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }

        .clan-tag {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 5px;
            color: #e4e4e7;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .clan-tag:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .discord-activity {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.72);
            margin-top: 3px;
            max-width: 205px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ubicación con el mismo efecto de selección/brillo que los iconos */
        .location-row {
            --delay: 0.50s;
            --z-depth: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 0.84rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 18px;
            padding: 5px 12px;
            border-radius: 10px;
            z-index: 2;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
        }

        body.ready-3d .location-row {
            transition: transform 0.22s ease, filter 0.22s ease, color 0.22s ease, background 0.22s ease;
        }

        body.ready-3d .location-row:hover {
            transform: translateZ(34px) scale(1.15) translateY(-2px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        .location-row i {
            color: #ffffff;
            font-size: 0.88rem;
        }

        .ar-flag {
            width: 18px;
            height: 13px;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }

        /* Redes Sociales */
        .social-links {
            --delay: 0.57s;
            --z-depth: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
            z-index: 2;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.55rem;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
        }

        .social-links a:hover {
            transform: scale(1.16) translateY(-2px);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Contador de vistas reales */
        .views-counter {
            --delay: 0.62s;
            --z-depth: 24px;
            position: absolute;
            bottom: 14px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            z-index: 2;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
        }

        body.ready-3d .views-counter {
            transition: transform 0.22s ease, filter 0.22s ease, color 0.22s ease;
        }

        body.ready-3d .views-counter:hover {
            transform: translateZ(30px) scale(1.15) translateY(-2px);
            color: #ffffff;
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Barra Reproductor Inferior con animación de entrada */
        .music-player {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.05);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            opacity: 0;
            transform: scaleX(0.76) scaleY(0.3) translateY(20px);
            transition:
                opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.18s,
                transform 0.78s cubic-bezier(0.22, 1, 0.36, 1) 0.18s,
                background 0.78s ease 0.18s,
                backdrop-filter 0.78s ease 0.18s,
                border-color 0.4s ease,
                box-shadow 0.78s ease 0.18s;
        }

        body.entered .music-player {
            opacity: 1;
            background: rgba(15, 15, 18, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            transform: scaleX(1) scaleY(1) translateY(0);
        }

        .album-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transform: translateZ(20px);
            z-index: 2;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .album-cover:hover {
            transform: translateZ(28px) scale(1.12);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.7);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateZ(20px);
            z-index: 2;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: text-shadow 0.2s ease;
        }

        .track-title:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            overflow: hidden;
            transition: height 0.15s ease, box-shadow 0.2s ease;
        }

        .progress-bar-bg:hover {
            height: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 4px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            transform: translateZ(25px);
            z-index: 2;
        }

        .player-controls i {
            transition: color 0.2s, transform 0.2s, filter 0.2s;
        }

        .player-controls i:hover {
            color: #fff;
            transform: scale(1.2) translateY(-1px);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1));
        }
    </style>
</head>
<body>

    <div id="enter-screen">
        <span>click to enter...</span>
    </div>

    <!-- Botón de Volumen en la esquina superior derecha -->
    <div class="top-volume-widget" id="volume-widget">
        <button class="vol-btn" id="vol-mute-btn" title="Mute / Unmute">
            <i class="fa-solid fa-volume-high" id="vol-icon"></i>
        </button>
        <div class="vol-slider-wrap">
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.45">
        </div>
    </div>

    <!-- Video de fondo -->
    <video id="bg-video" loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/njkp5q.mp4" type="video/mp4">
    </video>

    <!-- Tu canción MP3 -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://files.catbox.moe/yu0f1s.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <!-- Ventana Transparente 1 -->
        <div class="profile-card tilt-card">
            <!-- Imagen central fija -->
            <img id="top-avatar" class="main-avatar reveal-item" src="https://files.catbox.moe/xobhu9.png" alt="Avatar">
            
            <!-- Nombre con efecto de partículas -->
            <div class="name-sparkle-wrap reveal-item" id="sparkle-container">
                <h1 class="title-glow">Catruu</h1>
            </div>

            <p class="subtitle reveal-item">KYVEN STORE</p>

            <!-- Rectángulo redondeado de Im,Catri -->
            <div class="discord-box reveal-item">
                <div class="discord-avatar-wrap">
                    <img id="dc-avatar" class="dc-user-img" src="https://files.catbox.moe/0lba8z.png" alt="Discord">
                    <img class="venom-frame-overlay" src="https://files.catbox.moe/38e150.png" alt="Venom Frame">
                    <div id="dc-status" class="status-dot"></div>
                </div>

                <div class="discord-info">
                    <div class="discord-name-row">
                        <span id="dc-displayname" class="discord-toon-nick">Im,Catri</span>
                        <span id="dc-username" class="discord-sub-username">@catruuu</span>
                        <span class="clan-tag">🗡️ LC</span>
                    </div>
                    <span id="dc-activity" class="discord-activity">currently doing nothing</span>
                </div>
            </div>

            <!-- Ubicación interactiva debajo del rectángulo redondeado -->
            <div class="location-row reveal-item" title="Ubicación: Argentina">
                <i class="fa-solid fa-location-dot"></i>
                <span>Argentina</span>
                <img class="ar-flag" src="https://flagcdn.com/w40/ar.png" alt="Argentina">
            </div>

            <!-- Redes sociales -->
            <div class="social-links reveal-item">
                <a href="https://discord.gg/RH6KsX77p4" target="_blank" rel="noopener noreferrer" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="https://www.tiktok.com/@catrii.valdez" target="_blank" rel="noopener noreferrer" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://steamcommunity.com/id/DexterM0ser/" target="_blank" rel="noopener noreferrer" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
            </div>

            <!-- Contador de vistas reales por IP -->
            <div class="views-counter reveal-item" title="Visitas únicas">
                <i class="fa-regular fa-eye"></i>
                <span id="view-count">1</span>
            </div>
        </div>

        <!-- Ventana Transparente 2: Reproductor de Música -->
        <div class="music-player tilt-card">
            <div class="album-cover">
                <img src="https://files.catbox.moe/2j0e1z.jpg" alt="Cover">
            </div>
            <div class="track-details">
                <div class="track-title">AMANECE</div>
                <div class="progress-row">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                <i class="fa-solid fa-pause" id="play-pause-btn"></i>
                <i class="fa-solid fa-forward-step" id="next-btn"></i>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Animación suave del título en la pestaña (@C -> @Ca -> @Catruu) ---
        const tabWord = "Catruu";
        let charIndex = 0;
        let isDeleting = false;

        function animateTabTitle() {
            document.title = "@" + tabWord.substring(0, charIndex);
            let speed = isDeleting ? 380 : 520;

            if (!isDeleting && charIndex === tabWord.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                speed = 700;
                isDeleting = false;
            }

            charIndex += isDeleting ? -1 : 1;
            setTimeout(animateTabTitle, speed);
        }
        animateTabTitle();

        // --- 2. Partículas alrededor de Catruu ---
        const sparkleContainer = document.getElementById('sparkle-container');
        const totalSparkles = 26;

        for (let i = 0; i < totalSparkles; i++) {
            const dot = document.createElement('span');
            dot.className = 'sparkle-particle';
            const size = (Math.random() * 2.8 + 1.5).toFixed(1);
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            dot.style.left = `${Math.random() * 100}%`;
            dot.style.top = `${Math.random() * 85 + 10}%`;
            dot.style.animationDuration = `${(Math.random() * 1.8 + 1.2).toFixed(2)}s`;
            dot.style.animationDelay = `${(Math.random() * 2).toFixed(2)}s`;
            sparkleContainer.appendChild(dot);
        }

        // --- 3. Efecto 3D al pasar el cursor (se activa tras terminar la animación de apertura) ---
        const tiltCards = document.querySelectorAll('.tilt-card');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                if (!document.body.classList.contains('ready-3d')) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const maxTilt = card.classList.contains('music-player') ? 8 : 11;
                const rotateX = ((y - centerY) / centerY) * -maxTilt;
                const rotateY = ((x - centerX) / centerX) * maxTilt;

                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.015, 1.015, 1.015)`;
            });

            card.addEventListener('mouseleave', () => {
                if (!document.body.classList.contains('ready-3d')) return;
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // --- 4. Apertura Smooth, Controles de Video, Música y Botón de Volumen Superior ---
        const enterScreen = document.getElementById('enter-screen');
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        // Elementos de Volumen Arriba a la Derecha
        const volMuteBtn = document.getElementById('vol-mute-btn');
        const volIcon = document.getElementById('vol-icon');
        const volSlider = document.getElementById('vol-slider');
        let lastVolume = 0.45;
        audio.volume = lastVolume;

        function updateVolumeUI(val) {
            const pct = Math.round(val * 100);
            volSlider.style.background = `linear-gradient(to right, #ffffff ${pct}%, rgba(255, 255, 255, 0.22) ${pct}%)`;

            if (audio.muted || val === 0) {
                volIcon.className = 'fa-solid fa-volume-xmark';
            } else if (val < 0.5) {
                volIcon.className = 'fa-solid fa-volume-low';
            } else {
                volIcon.className = 'fa-solid fa-volume-high';
            }
        }
        updateVolumeUI(lastVolume);

        // Deslizar barra para subir/bajar volumen
        volSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            audio.volume = val;
            if (val > 0) {
                audio.muted = false;
                lastVolume = val;
            } else {
                audio.muted = true;
            }
            updateVolumeUI(val);
        });

        // Tocar icono para mutear / desmutear
        volMuteBtn.addEventListener('click', () => {
            if (audio.muted || audio.volume === 0) {
                audio.muted = false;
                audio.volume = lastVolume > 0 ? lastVolume : 0.45;
                volSlider.value = audio.volume;
                updateVolumeUI(audio.volume);
            } else {
                lastVolume = audio.volume;
                audio.muted = true;
                volSlider.value = 0;
                updateVolumeUI(0);
            }
        });

        // Función de entrada con animación escalonada limpia
        let hasEntered = false;
        function triggerSmoothEnter() {
            if (hasEntered) return;
            hasEntered = true;

            enterScreen.style.opacity = '0';
            setTimeout(() => { enterScreen.style.display = 'none'; }, 650);

            // Dispara la animación de expansión de las tarjetas y elementos en cascada
            requestAnimationFrame(() => {
                document.body.classList.add('entered');
            });

            // Habilita el seguimiento 3D cuando termina la animación de entrada
            setTimeout(() => {
                document.body.classList.add('ready-3d');
            }, 950);

            video.play().catch(() => {});
            audio.play().catch(() => {});
        }

        enterScreen.addEventListener('click', triggerSmoothEnter);

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playPauseBtn.className = 'fa-solid fa-play';
            }
        });

        prevBtn.addEventListener('click', () => { audio.currentTime = 0; });
        nextBtn.addEventListener('click', () => { audio.currentTime = 0; });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audio.duration) {
                audio.currentTime = (clickX / rect.width) * audio.duration;
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent || 0}%`;
        });

        // --- 5. Estado de Discord: SSE en vivo + respaldo por HTTP ---
        const dcAvatar = document.getElementById('dc-avatar');
        const dcStatus = document.getElementById('dc-status');
        const dcActivity = document.getElementById('dc-activity');
        const statusColors = {
            online: '#23a55a',
            idle: '#f0b232',
            dnd: '#f23f43',
            offline: '#80848e',
            unknown: '#80848e'
        };

        function renderDiscord(data) {
            if (!data || data.error) {
                dcStatus.style.backgroundColor = statusColors.unknown;
                dcActivity.textContent = 'Discord no disponible';
                return;
            }
            if (data.displayName) document.getElementById('dc-displayname').textContent = data.displayName;
            if (data.username) document.getElementById('dc-username').textContent = `@${data.username}`;
            dcActivity.textContent = data.activity || 'currently doing nothing';
            dcStatus.style.backgroundColor = statusColors[data.status] || statusColors.unknown;
            if (typeof data.views === 'number') document.getElementById('view-count').textContent = data.views;
        }

        async function fetchDiscordStatus() {
            try {
                const response = await fetch('/api/catruu-status', { cache: 'no-store' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
                renderDiscord(data);
            } catch (error) {
                renderDiscord({ error: error.message });
            }
        }

        let fallbackTimer = null;
        function startFallback() {
            if (!fallbackTimer) fallbackTimer = setInterval(fetchDiscordStatus, 15000);
        }
        function stopFallback() {
            if (fallbackTimer) clearInterval(fallbackTimer);
            fallbackTimer = null;
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 30000);
        if ('EventSource' in window) {
            const stream = new EventSource('/api/catruu-events');
            stream.addEventListener('profile', event => {
                try { renderDiscord(JSON.parse(event.data)); }
                catch (error) { console.error('Evento Discord no válido:', error); }
            });
            stream.addEventListener('server-error', event => {
                try { renderDiscord(JSON.parse(event.data)); }
                catch (error) { console.error('Error en el servidor:', error); }
            });
            stream.onopen = stopFallback;
            stream.onerror = () => {
                startFallback();
            };
        } else {
            startFallback();
        }
    </script>
</body>
</html>
