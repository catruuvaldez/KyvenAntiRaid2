<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@</title>
    <!-- Icono en la pestaña -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/1cv7on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuentes: Syne (Catruu), Rubik Bubbles / Fredoka (estilo Discord Toon para Im,Catri) e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Inter:wght@400;600;700&family=Rubik+Bubbles&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* Cursor personalizado (.cur) aplicado a toda la página y elementos interactivos */
        *, html, body, a, i, button, #enter-screen, .location-row, .discord-box, .views-counter, .progress-bar-bg {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            cursor: url('https://files.catbox.moe/eiz2nf.cur'), auto !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            color: #ffffff;
        }

        /* Pantalla de entrada */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease;
        }

        #enter-screen span {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            animation: pulse 2.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Video de fondo */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.88);
        }

        /* Contenedor con perspectiva 3D */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            perspective: 1100px;
        }

        /* Efecto 3D en ambas ventanas transparentes */
        .tilt-card {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        .tilt-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.11),
                transparent 45%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 0;
        }

        .tilt-card:hover::before {
            opacity: 1;
        }

        .tilt-card:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        /* Tarjeta Principal */
        .profile-card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 32px 24px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }

        /* Imagen del medio fija con efecto al pasar el mouse */
        .main-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.65);
            transform: translateZ(30px);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            z-index: 2;
        }

        .main-avatar:hover {
            transform: translateZ(38px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
        }

        /* Contenedor de nombre con chispas blancas */
        .name-sparkle-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 18px;
            margin-bottom: 2px;
            transform: translateZ(40px);
            z-index: 2;
        }

        .title-glow {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.9),
                0 0 28px rgba(255, 255, 255, 0.55),
                0 0 45px rgba(168, 85, 247, 0.45);
            line-height: 1.1;
            position: relative;
            z-index: 2;
            transition: transform 0.22s ease, text-shadow 0.22s ease;
        }

        .name-sparkle-wrap:hover .title-glow {
            transform: scale(1.06);
            text-shadow: 
                0 0 16px rgba(255, 255, 255, 1),
                0 0 34px rgba(255, 255, 255, 0.85),
                0 0 55px rgba(168, 85, 247, 0.75);
        }

        .sparkle-particle {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            box-shadow: 0 0 6px #ffffff, 0 0 10px rgba(255, 255, 255, 0.9);
            animation: floatSparkle linear infinite;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(4px) scale(0); opacity: 0; }
            35% { opacity: 1; transform: translateY(-2px) scale(1); }
            70% { opacity: 0.85; }
            100% { transform: translateY(-16px) scale(0); opacity: 0; }
        }

        /* Subtítulo en MAYÚSCULAS ("KYVEN STORE") */
        .subtitle {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2.2px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            margin-bottom: 18px;
            transform: translateZ(25px);
            transition: transform 0.22s ease, text-shadow 0.22s ease, color 0.22s ease;
            z-index: 2;
        }

        .subtitle:hover {
            transform: translateZ(30px) scale(1.06);
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }

        /* Mini tarjeta redondeada de Discord con reacción al pasar el mouse */
        .discord-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(18, 18, 22, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.11);
            padding: 13px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            min-width: 285px;
            transform: translateZ(28px);
            z-index: 2;
            transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .discord-box:hover {
            transform: translateZ(34px) scale(1.03) translateY(-2px);
            background: rgba(28, 28, 34, 0.56);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Contenedor del Avatar con el marco PNG de Venom (38e150.png) */
        .discord-avatar-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discord-avatar-wrap img.dc-user-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        /* Tu marco oficial de Venom (https://files.catbox.moe/38e150.png) */
        .venom-frame-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 68px;
            height: 68px;
            transform: translate(-50%, -50%);
            object-fit: contain;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.85));
            transition: transform 0.25s ease;
        }

        .discord-box:hover .venom-frame-overlay {
            transform: translate(-50%, -50%) scale(1.06);
        }

        .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2.5px solid #101014;
            background-color: #f23f43;
            transition: background-color 0.3s ease;
            z-index: 4;
        }

        .discord-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-name-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* Estilo de fuente "Dibujo animado" en blanco de Discord para Im,Catri */
        .discord-toon-nick {
            font-family: 'Rubik Bubbles', 'Fredoka', cursive, sans-serif;
            font-size: 1.02rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.4px;
            text-shadow:
                0 1px 0 #d4d4d8,
                0 2px 0 #18181b,
                -1px -1px 0 #18181b,
                1px -1px 0 #18181b,
                -1px 1px 0 #18181b,
                1px 1px 0 #18181b,
                0 0 10px rgba(255, 255, 255, 0.45);
            animation: toonBounce 3s ease-in-out infinite;
        }

        @keyframes toonBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }

        .discord-sub-username {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }

        .clan-tag {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 5px;
            color: #e4e4e7;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .clan-tag:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .discord-activity {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.72);
            margin-top: 3px;
            max-width: 205px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ubicación con el mismo efecto de selección/brillo que los iconos al pasar el mouse */
        .location-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 0.84rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 18px;
            padding: 5px 12px;
            border-radius: 10px;
            transform: translateZ(28px);
            z-index: 2;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
            transition: transform 0.22s ease, filter 0.22s ease, color 0.22s ease, background 0.22s ease;
        }

        .location-row:hover {
            transform: translateZ(34px) scale(1.15) translateY(-2px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        .location-row i {
            color: #ffffff;
            font-size: 0.88rem;
        }

        .ar-flag {
            width: 18px;
            height: 13px;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }

        /* Redes Sociales */
        .social-links {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
            transform: translateZ(32px);
            z-index: 2;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.55rem;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
        }

        .social-links a:hover {
            transform: scale(1.16) translateY(-2px);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Contador de vistas reales con efecto de selección al pasar el mouse */
        .views-counter {
            position: absolute;
            bottom: 14px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transform: translateZ(24px);
            z-index: 2;
            transition: transform 0.22s ease, filter 0.22s ease, color 0.22s ease;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
        }

        .views-counter:hover {
            transform: translateZ(30px) scale(1.15) translateY(-2px);
            color: #ffffff;
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Barra Reproductor Inferior */
        .music-player {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }

        .album-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transform: translateZ(20px);
            z-index: 2;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .album-cover:hover {
            transform: translateZ(28px) scale(1.12);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.7);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateZ(20px);
            z-index: 2;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: text-shadow 0.2s ease;
        }

        .track-title:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            overflow: hidden;
            transition: height 0.15s ease, box-shadow 0.2s ease;
        }

        .progress-bar-bg:hover {
            height: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 4px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            transform: translateZ(25px);
            z-index: 2;
        }

        .player-controls i {
            transition: color 0.2s, transform 0.2s, filter 0.2s;
        }

        .player-controls i:hover {
            color: #fff;
            transform: scale(1.2) translateY(-1px);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1));
        }
    </style>
</head>
<body>

    <div id="enter-screen">
        <span>click to enter...</span>
    </div>

    <!-- Video de fondo -->
    <video id="bg-video" loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/njkp5q.mp4" type="video/mp4">
    </video>

    <!-- Tu canción MP3 -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://files.catbox.moe/yu0f1s.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <!-- Ventana Transparente 1 -->
        <div class="profile-card tilt-card">
            <!-- Imagen central fija -->
            <img id="top-avatar" class="main-avatar" src="https://files.catbox.moe/xobhu9.png" alt="Avatar">
            
            <!-- Nombre con efecto de partículas -->
            <div class="name-sparkle-wrap" id="sparkle-container">
                <h1 class="title-glow">Catruu</h1>
            </div>

            <p class="subtitle">KYVEN STORE</p>

            <!-- Rectángulo redondeado de Im,Catri -->
            <div class="discord-box">
                <div class="discord-avatar-wrap">
                    <!-- Foto de perfil del cuadro Im,Catri -->
                    <img id="dc-avatar" class="dc-user-img" src="https://files.catbox.moe/0lba8z.png" alt="Discord">
                    <!-- Marco oficial de Venom superpuesto (38e150.png) -->
                    <img class="venom-frame-overlay" src="https://files.catbox.moe/38e150.png" alt="Venom Frame">
                    <div id="dc-status" class="status-dot"></div>
                </div>

                <div class="discord-info">
                    <div class="discord-name-row">
                        <span id="dc-displayname" class="discord-toon-nick">Im,Catri</span>
                        <span id="dc-username" class="discord-sub-username">@catruuu</span>
                        <span class="clan-tag">🗡️ LC</span>
                    </div>
                    <span id="dc-activity" class="discord-activity">currently doing nothing</span>
                </div>
            </div>

            <!-- Ubicación interactiva debajo del rectángulo redondeado -->
            <div class="location-row" title="Ubicación: Argentina">
                <i class="fa-solid fa-location-dot"></i>
                <span>Argentina</span>
                <img class="ar-flag" src="https://flagcdn.com/w40/ar.png" alt="Argentina">
            </div>

            <!-- Redes sociales -->
            <div class="social-links">
                <a href="https://discord.gg/RH6KsX77p4" target="_blank" rel="noopener noreferrer" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="https://www.tiktok.com/@catrii.valdez" target="_blank" rel="noopener noreferrer" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://steamcommunity.com/id/DexterM0ser/" target="_blank" rel="noopener noreferrer" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
            </div>

            <!-- Contador de vistas reales por IP -->
            <div class="views-counter" title="Visitas únicas">
                <i class="fa-regular fa-eye"></i>
                <span id="view-count">1</span>
            </div>
        </div>

        <!-- Ventana Transparente 2: Reproductor de Música -->
        <div class="music-player tilt-card">
            <div class="album-cover">
                <img src="https://files.catbox.moe/2j0e1z.jpg" alt="Cover">
            </div>
            <div class="track-details">
                <div class="track-title">AMANECE</div>
                <div class="progress-row">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                <i class="fa-solid fa-pause" id="play-pause-btn"></i>
                <i class="fa-solid fa-forward-step" id="next-btn"></i>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Animación suave del título en la pestaña (@C -> @Ca -> @Catruu) ---
        const tabWord = "Catruu";
        let charIndex = 0;
        let isDeleting = false;

        function animateTabTitle() {
            document.title = "@" + tabWord.substring(0, charIndex);
            let speed = isDeleting ? 380 : 520;

            if (!isDeleting && charIndex === tabWord.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                speed = 700;
                isDeleting = false;
            }

            charIndex += isDeleting ? -1 : 1;
            setTimeout(animateTabTitle, speed);
        }
        animateTabTitle();

        // --- 2. Partículas alrededor de Catruu ---
        const sparkleContainer = document.getElementById('sparkle-container');
        const totalSparkles = 26;

        for (let i = 0; i < totalSparkles; i++) {
            const dot = document.createElement('span');
            dot.className = 'sparkle-particle';
            const size = (Math.random() * 2.8 + 1.5).toFixed(1);
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            dot.style.left = `${Math.random() * 100}%`;
            dot.style.top = `${Math.random() * 85 + 10}%`;
            dot.style.animationDuration = `${(Math.random() * 1.8 + 1.2).toFixed(2)}s`;
            dot.style.animationDelay = `${(Math.random() * 2).toFixed(2)}s`;
            sparkleContainer.appendChild(dot);
        }

        // --- 3. Efecto 3D al pasar el cursor ---
        const tiltCards = document.querySelectorAll('.tilt-card');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const maxTilt = card.classList.contains('music-player') ? 8 : 11;
                const rotateX = ((y - centerY) / centerY) * -maxTilt;
                const rotateY = ((x - centerX) / centerX) * maxTilt;

                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.015, 1.015, 1.015)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // --- 4. Controles de Video y Música ---
        const enterScreen = document.getElementById('enter-screen');
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        audio.volume = 0.45;

        enterScreen.addEventListener('click', () => {
            enterScreen.style.opacity = '0';
            setTimeout(() => enterScreen.style.display = 'none', 700);
            video.play();
            audio.play();
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playPauseBtn.className = 'fa-solid fa-play';
            }
        });

        prevBtn.addEventListener('click', () => { audio.currentTime = 0; });
        nextBtn.addEventListener('click', () => { audio.currentTime = 0; });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audio.duration) {
                audio.currentTime = (clickX / rect.width) * audio.duration;
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent || 0}%`;
        });

        // --- 5. Cargar Estado de Discord en vivo ---
        async function fetchDiscordStatus() {
            try {
                const res = await fetch('/api/catruu-status');
                const data = await res.json();

                document.getElementById('dc-displayname').textContent = data.displayName || 'Im,Catri';
                document.getElementById('dc-username').textContent = data.username ? `@${data.username}` : '@catruuu';
                document.getElementById('dc-activity').textContent = data.activity || 'currently doing nothing';
                document.getElementById('view-count').textContent = data.views;

                const statusColors = {
                    online: '#23a55a',
                    idle: '#f0b232',
                    dnd: '#f23f43',
                    offline: '#80848e'
                };
                document.getElementById('dc-status').style.backgroundColor = statusColors[data.status] || '#80848e';
            } catch (e) {
                console.error('Error cargando estado de Discord:', e);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 25000);
    </script>
</body>
</html>
