<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@</title>
    <!-- Icono en la pestaña -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/1cv7on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            color: #ffffff;
        }

        /* Pantalla de entrada */
        #enter-screen {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.7s ease;
        }

        #enter-screen span {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            animation: pulse 2.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Video de fondo */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.85);
        }

        /* Contenedor con perspectiva 3D */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            perspective: 1100px;
        }

        /* Clase compartida para el efecto 3D en ambas ventanas transparentes */
        .tilt-card {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        /* Brillo dinámico que sigue al mouse en 3D */
        .tilt-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.12),
                transparent 45%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 0;
        }

        .tilt-card:hover::before {
            opacity: 1;
        }

        .tilt-card:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        /* Tarjeta Principal */
        .profile-card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.34);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 18px;
            padding: 32px 24px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
        }

        /* Imagen del medio fija (xobhu9.png) */
        .main-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.65);
            transform: translateZ(30px);
        }

        /* Contenedor de nombre con chispas/partículas blancas (estilo ENROLA) */
        .name-sparkle-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 18px;
            margin-bottom: 2px;
            transform: translateZ(40px);
        }

        .title-glow {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.9),
                0 0 28px rgba(255, 255, 255, 0.55),
                0 0 45px rgba(168, 85, 247, 0.45);
            line-height: 1.1;
            position: relative;
            z-index: 2;
        }

        /* Partículas/Chispas alrededor del texto */
        .sparkle-particle {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            box-shadow: 0 0 6px #ffffff, 0 0 10px rgba(255, 255, 255, 0.9);
            animation: floatSparkle linear infinite;
        }

        @keyframes floatSparkle {
            0% {
                transform: translateY(4px) scale(0);
                opacity: 0;
            }
            35% {
                opacity: 1;
                transform: translateY(-2px) scale(1);
            }
            70% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-16px) scale(0);
                opacity: 0;
            }
        }

        /* Subtítulo en MAYÚSCULAS ("KYVEN STORE") */
        .subtitle {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2.2px;
            color: rgba(255, 255, 255, 0.82);
            text-transform: uppercase;
            margin-bottom: 20px;
            transform: translateZ(25px);
        }

        /* Mini tarjeta de estado de Discord real */
        .discord-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 20, 24, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.11);
            padding: 10px 16px;
            border-radius: 14px;
            margin-bottom: 22px;
            min-width: 265px;
            transform: translateZ(28px);
            z-index: 2;
        }

        .discord-avatar-wrap {
            position: relative;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
        }

        .discord-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2.5px solid #141416;
            background-color: #f23f43;
            transition: background-color 0.3s ease;
        }

        .discord-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .discord-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.92rem;
            color: #fff;
        }

        .discord-sub-username {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .clan-tag {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 5px;
            color: #e4e4e7;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .discord-activity {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
            max-width: 195px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Redes Sociales */
        .social-links {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
            transform: translateZ(32px);
            z-index: 2;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.55rem;
            transition: transform 0.22s ease, filter 0.22s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
        }

        .social-links a:hover {
            transform: scale(1.16) translateY(-2px);
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 1));
        }

        /* Contador de vistas reales */
        .views-counter {
            position: absolute;
            bottom: 14px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transform: translateZ(20px);
            z-index: 2;
        }

        /* Barra Reproductor Inferior con efecto 3D */
        .music-player {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 18, 0.34);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
        }

        .album-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transform: translateZ(20px);
            z-index: 2;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateZ(20px);
            z-index: 2;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 4px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            transform: translateZ(25px);
            z-index: 2;
        }

        .player-controls i {
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
        }

        .player-controls i:hover {
            color: #fff;
            transform: scale(1.12);
        }
    </style>
</head>
<body>

    <div id="enter-screen">
        <span>click to enter...</span>
    </div>

    <!-- Video de fondo -->
    <video id="bg-video" loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/njkp5q.mp4" type="video/mp4">
    </video>

    <!-- Tu canción MP3 -->
    <audio id="bg-audio" loop preload="auto">
        <source src="https://files.catbox.moe/yu0f1s.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <!-- Ventana Transparente 1 (con efecto 3D) -->
        <div class="profile-card tilt-card">
            <!-- Imagen central fija que pediste -->
            <img id="top-avatar" class="main-avatar" src="https://files.catbox.moe/xobhu9.png" alt="Avatar">
            
            <!-- Nombre con efecto de partículas/destellos igual a tu captura -->
            <div class="name-sparkle-wrap" id="sparkle-container">
                <h1 class="title-glow">Catruu</h1>
            </div>

            <!-- Solo KYVEN STORE en mayúsculas -->
            <p class="subtitle">KYVEN STORE</p>

            <!-- Caja de Discord conectada a tu perfil real -->
            <div class="discord-box">
                <div class="discord-avatar-wrap">
                    <img id="dc-avatar" src="https://files.catbox.moe/xobhu9.png" alt="Discord">
                    <div id="dc-status" class="status-dot"></div>
                </div>
                <div class="discord-info">
                    <div class="discord-name-row">
                        <span id="dc-displayname">Im,Catri</span>
                        <span id="dc-username" class="discord-sub-username">@catruuu</span>
                        <span class="clan-tag">🗡️ LC</span>
                    </div>
                    <span id="dc-activity" class="discord-activity">currently doing nothing</span>
                </div>
            </div>

            <!-- Tus links reales -->
            <div class="social-links">
                <a href="https://discord.gg/RH6KsX77p4" target="_blank" rel="noopener noreferrer" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="https://www.tiktok.com/@catrii.valdez" target="_blank" rel="noopener noreferrer" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://steamcommunity.com/id/DexterM0ser/" target="_blank" rel="noopener noreferrer" title="Steam">
                    <i class="fa-brands fa-steam"></i>
                </a>
            </div>

            <!-- Contador de vistas reales por IP -->
            <div class="views-counter">
                <i class="fa-regular fa-eye"></i>
                <span id="view-count">1</span>
            </div>
        </div>

        <!-- Ventana Transparente 2: Reproductor de Música (con efecto 3D) -->
        <div class="music-player tilt-card">
            <div class="album-cover">
                <img src="https://files.catbox.moe/2j0e1z.jpg" alt="Cover">
            </div>
            <div class="track-details">
                <div class="track-title">AMANECE</div>
                <div class="progress-row">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                <i class="fa-solid fa-pause" id="play-pause-btn"></i>
                <i class="fa-solid fa-forward-step" id="next-btn"></i>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Animación suave (smooth) del título en la pestaña (@C -> @Ca -> @Catruu) ---
        const tabWord = "Catruu";
        let charIndex = 0;
        let isDeleting = false;

        function animateTabTitle() {
            document.title = "@" + tabWord.substring(0, charIndex);
            let speed = isDeleting ? 380 : 520;

            if (!isDeleting && charIndex === tabWord.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                speed = 700;
                isDeleting = false;
            }

            charIndex += isDeleting ? -1 : 1;
            setTimeout(animateTabTitle, speed);
        }
        animateTabTitle();

        // --- 2. Generador de partículas/chispas blancas alrededor del nombre (estilo ENROLA) ---
        const sparkleContainer = document.getElementById('sparkle-container');
        const totalSparkles = 26;

        for (let i = 0; i < totalSparkles; i++) {
            const dot = document.createElement('span');
            dot.className = 'sparkle-particle';
            const size = (Math.random() * 2.8 + 1.5).toFixed(1);
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            dot.style.left = `${Math.random() * 100}%`;
            dot.style.top = `${Math.random() * 85 + 10}%`;
            dot.style.animationDuration = `${(Math.random() * 1.8 + 1.2).toFixed(2)}s`;
            dot.style.animationDelay = `${(Math.random() * 2).toFixed(2)}s`;
            sparkleContainer.appendChild(dot);
        }

        // --- 3. Efecto 3D al pasar el cursor en las 2 tarjetas transparentes ---
        const tiltCards = document.querySelectorAll('.tilt-card');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                // Inclinación suave en 3D según la posición del cursor
                const maxTilt = card.classList.contains('music-player') ? 8 : 11;
                const rotateX = ((y - centerY) / centerY) * -maxTilt;
                const rotateY = ((x - centerX) / centerX) * maxTilt;

                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.015, 1.015, 1.015)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // --- 4. Controles de Video y Música ---
        const enterScreen = document.getElementById('enter-screen');
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('bg-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        audio.volume = 0.45;

        enterScreen.addEventListener('click', () => {
            enterScreen.style.opacity = '0';
            setTimeout(() => enterScreen.style.display = 'none', 700);
            video.play();
            audio.play();
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playPauseBtn.className = 'fa-solid fa-play';
            }
        });

        prevBtn.addEventListener('click', () => { audio.currentTime = 0; });
        nextBtn.addEventListener('click', () => { audio.currentTime = 0; });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audio.duration) {
                audio.currentTime = (clickX / rect.width) * audio.duration;
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent || 0}%`;
        });

        // --- 5. Cargar tu Apodo, Foto de Perfil Real y Estado de Discord ---
        async function fetchDiscordStatus() {
            try {
                const res = await fetch('/api/catruu-status');
                const data = await res.json();

                document.getElementById('dc-displayname').textContent = data.displayName || 'Im,Catri';
                document.getElementById('dc-username').textContent = data.username ? `@${data.username}` : '@catruuu';
                
                // Actualiza solo el avatar de tu cajita de Discord, dejando intacta tu imagen del medio (xobhu9.png)
                if (data.avatar) {
                    document.getElementById('dc-avatar').src = data.avatar;
                }
                document.getElementById('dc-activity').textContent = data.activity || 'currently doing nothing';
                document.getElementById('view-count').textContent = data.views;

                const statusColors = {
                    online: '#23a55a', // Conectado
                    idle: '#f0b232',   // Ausente
                    dnd: '#f23f43',    // No molestar
                    offline: '#80848e' // Desconectado
                };
                document.getElementById('dc-status').style.backgroundColor = statusColors[data.status] || '#80848e';
            } catch (e) {
                console.error('Error cargando estado de Discord:', e);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 25000);
    </script>
</body>
</html>
